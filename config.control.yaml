# Control run: random split, no injected drift, no simulated overrides.
# The checks should stay quiet here; whatever they flag is a false alarm of the method.
seed: 42
data:
  path: data/raw/taiwan_default.csv
scorecard:
  features: [LIMIT_BAL, AGE, PAY_0, PAY_2, PAY_3, PAY_4, PAY_5, PAY_6,
             PAY_RATIO, UTIL_AVG, PAY6_RATIO, PAY_AMT_LIM, BILL_TREND]
drift:
  enabled: false
overrides:
  enabled: false
output:
  report: reports/control/model_audit_report.md
  figures_dir: reports/control/figures
