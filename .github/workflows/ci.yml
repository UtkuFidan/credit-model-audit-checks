name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,model]"
      - run: ruff check .
      - run: ruff format --check .
      # tests run offline on a synthetic fixture (tests/conftest.py); no dataset download needed
      - run: pytest -q
